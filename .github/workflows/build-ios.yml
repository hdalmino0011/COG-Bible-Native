name: Build iOS IPA (Xcode)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build & Export iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ImageMagick for icon rendering
        run: brew install imagemagick

      - name: Install npm dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Prepare and sync Native iOS project
        run: |
          # 1. If native iOS project or CapApp-SPM is missing or incomplete, initialize fresh platform
          if [ ! -d "./ios/App/CapApp-SPM" ] || [ ! -f "./ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "Native iOS project incomplete or CapApp-SPM missing. Initializing fresh iOS platform via Capacitor..."
            rm -rf ios
            npx cap add ios
          fi

          # 2. Ensure authentic fallback Podfile exists if CocoaPods is ever invoked on macOS runners
          if [ ! -f "./ios/App/Podfile" ]; then
            cat << 'EOF' > ./ios/App/Podfile
require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

platform :ios, '15.0'
use_frameworks!

install! 'cocoapods', :disable_input_output_paths => true

def capacitor_pods
  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
end

target 'App' do
  capacitor_pods
end

post_install do |installer|
  assertDeploymentTarget(installer)
end
EOF
          fi

          # 3. Generate Church Logo icons and splash screens
          node scripts/generate-android-icons.cjs

          # 4. Sync web assets and native plugins into iOS project
          npx cap sync ios

      - name: Build iOS Application with Xcode
        run: |
          mkdir -p build

          # Select workspace if CocoaPods generated one, otherwise use Xcode project (SPM)
          BUILD_TARGET="-project ios/App/App.xcodeproj"
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET="-workspace ios/App/App.xcworkspace"
          fi

          echo "Building iOS with target: $BUILD_TARGET"

          # Attempt release archive; fall back to release device build if Xcode signing policy restricts archiving
          xcodebuild archive \
            $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || \
          xcodebuild build \
            $BUILD_TARGET \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Package iOS Application into IPA
        run: |
          mkdir -p build/Payload

          # Locate the compiled App.app
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            echo "Packaging from xcarchive..."
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          elif [ -d "build/DerivedData/Build/Products/Release-iphoneos/App.app" ]; then
            echo "Packaging from DerivedData..."
            cp -r build/DerivedData/Build/Products/Release-iphoneos/App.app build/Payload/
          else
            echo "Searching for App.app in build output directory..."
            APP_PATH=$(find build -name "App.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              echo "Found App.app at: $APP_PATH"
              cp -r "$APP_PATH" build/Payload/
            else
              echo "Error: App.app not found in build outputs!"
              find build
              exit 1
            fi
          fi

          # Apply ad-hoc code signature (standard for sideloadable iOS apps)
          if command -v codesign &> /dev/null; then
            echo "Applying ad-hoc code signature..."
            codesign --force --deep --sign - build/Payload/App.app || true
          fi

          # Zip Payload into IPA
          cd build
          zip -r -q cog-tjr-bible-offline.ipa Payload
          ls -lh cog-tjr-bible-offline.ipa

      - name: Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cog-tjr-bible-offline.ipa
          path: build/cog-tjr-bible-offline.ipa
          if-no-files-found: error
          retention-days: 30
