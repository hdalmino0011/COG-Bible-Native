name: Build iOS IPA (Xcode)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build & Export iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ImageMagick for icon rendering
        run: brew install imagemagick

      - name: Install npm dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Prepare and sync Native iOS project
        run: |
          if [ ! -d "./ios/App" ]; then
            echo "iOS project not found. Initializing iOS platform via Capacitor..."
            npx cap add ios
          fi
          # Generate Church Logo icons and splash screens
          node scripts/generate-android-icons.cjs
          # Sync web assets into iOS project
          npx cap sync ios

      - name: Build iOS Archive with Xcode
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package iOS Application into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -q cog-tjr-bible-offline.ipa Payload
          ls -lh cog-tjr-bible-offline.ipa

      - name: Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cog-tjr-bible-offline.ipa
          path: build/cog-tjr-bible-offline.ipa
          if-no-files-found: error
          retention-days: 30
