name: Build Pastor Lessons Upload APK (Gradle)

on:
  push:
    branches: ["main", "master"]
    paths:
      - "pastor-app/**"
      - ".github/workflows/build-pastor-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pastor-apk:
    name: Build & Export Pastor Upload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies & Build Pastor App
        run: |
          cd pastor-app
          npm install
          npm run build

      - name: Initialize & Sync Capacitor Native Android Project
        run: |
          cd pastor-app
          if [ ! -d "./android" ]; then
            echo "Initializing Capacitor Android project for Pastor App..."
            npx cap add android
          fi
          npx cap sync android
          chmod +x ./android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd pastor-app/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Pastor APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cog-pastor-lessons-upload-debug.apk
          path: pastor-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
