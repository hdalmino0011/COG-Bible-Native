name: Build Android APK (Gradle)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Prepare and sync Native Android project
        run: |
          # If android directory or gradlew is missing in repository checkout, generate it via Capacitor
          if [ ! -f "./android/gradlew" ]; then
            echo "Android project or gradlew not found. Initializing Android platform via Capacitor..."
            rm -rf android
            npx cap add android
          fi
          # Sync compiled web distribution and offline scriptures into Android native project
          npx cap sync android
          # Ensure gradlew has execute permissions
          chmod +x ./android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cog-tjr-bible-offline-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
